# REINVENT 4 configuration - Reinforcement or curriculum learning. The main optimisation mode.
# Generator: mol2mol (Transformer) - Optimising or hopping from a known compound.
# Generated by agskills. Review before submitting a long run.

run_type = "staged_learning"
device = "cuda:0"
tb_logdir = "tb_logs"
json_out_config = "_staged_learning.json"

[parameters]

summary_csv_prefix = "scaffold_hop"
use_checkpoint = false
purge_memories = false

prior_file = "priors/mol2mol_scaffold_generic.prior"
# agent_file starts equal to the prior; replace it with a
# checkpoint to resume an interrupted run.
agent_file = "priors/mol2mol_scaffold_generic.prior"
smiles_file = "lead.smi"
batch_size = 64
unique_sequences = true
randomize_smiles = true

[learning_strategy]
type = "dap"
sigma = 128
rate = 0.0001

# The diversity filter stops the agent collapsing onto one
# scaffold, which is the most common failure of an
# unconstrained RL run.
[diversity_filter]
type = "IdenticalMurckoScaffold"
bucket_size = 25
minscore = 0.4

### Stage 1. Stages are a list, hence the double brackets.
[[stage]]

chkpt_file = "scaffold_hop.chkpt"
termination = "simple"
max_score = 0.7
min_steps = 20
max_steps = 200

[stage.scoring]
type = "geometric_mean"

[[stage.scoring.component]]
[stage.scoring.component.QED]
[[stage.scoring.component.QED.endpoint]]
name = "QED drug-likeness"
weight = 2

[[stage.scoring.component]]
[stage.scoring.component.MolecularWeight]
[[stage.scoring.component.MolecularWeight.endpoint]]
name = "Molecular weight"
weight = 1
transform.type = "double_sigmoid"
transform.high = 500
transform.low = 200
transform.coef_div = 500
transform.coef_si = 20
transform.coef_se = 20

[[stage.scoring.component]]
[stage.scoring.component.SlogP]
[[stage.scoring.component.SlogP.endpoint]]
name = "Lipophilicity (SlogP)"
weight = 1
transform.type = "double_sigmoid"
transform.high = 4
transform.low = 1
transform.coef_div = 4
transform.coef_si = 20
transform.coef_se = 20

[[stage.scoring.component]]
[stage.scoring.component.TPSA]
[[stage.scoring.component.TPSA.endpoint]]
name = "Polar surface area"
weight = 1
transform.type = "double_sigmoid"
transform.high = 140
transform.low = 20
transform.coef_div = 140
transform.coef_si = 20
transform.coef_se = 20

[[stage.scoring.component]]
[stage.scoring.component.NumRotBond]
[[stage.scoring.component.NumRotBond.endpoint]]
name = "Rotatable bonds"
weight = 1
transform.type = "reverse_sigmoid"
transform.high = 10
transform.low = 2
transform.k = 0.5

[[stage.scoring.component]]
[stage.scoring.component.HBondDonors]
[[stage.scoring.component.HBondDonors.endpoint]]
name = "H-bond donors"
weight = 1
transform.type = "reverse_sigmoid"
transform.high = 5
transform.low = 0
transform.k = 0.5

[[stage.scoring.component]]
[stage.scoring.component.HBondAcceptors]
[[stage.scoring.component.HBondAcceptors.endpoint]]
name = "H-bond acceptors"
weight = 1
transform.type = "reverse_sigmoid"
transform.high = 10
transform.low = 0
transform.k = 0.5

[[stage.scoring.component]]
[stage.scoring.component.SAScore]
[[stage.scoring.component.SAScore.endpoint]]
name = "Synthetic accessibility"
weight = 1.5
transform.type = "reverse_sigmoid"
transform.high = 5
transform.low = 1
transform.k = 0.5

[[stage.scoring.component]]
[stage.scoring.component.custom_alerts]
[[stage.scoring.component.custom_alerts.endpoint]]
name = "Unwanted substructures"
weight = 1
params.smarts = [
    "[*;r{8-17}]",
    "[#8][#8]",
    "[#6;+]",
    "[#16][#16]",
    "[#7;!n][S;!$(S(=O)=O)]",
    "[#7;!n][#7;!n]",
    "C#C",
    "C(=[O,S])[O,S]",
    "[#7;!n][C;!$(C(=[O,N])[N,O])][#16;!s]",
    "[#7;!n][C;!$(C(=[O,N])[N,O])][#7;!n]",
    "[#7;!n][C;!$(C(=[O,N])[N,O])][#8;!o]",
    "[#8;!o][C;!$(C(=[O,N])[N,O])][#16;!s]",
    "[#8;!o][C;!$(C(=[O,N])[N,O])][#8;!o]",
    "[#16;!s][C;!$(C(=[O,N])[N,O])][#16;!s]",
]
