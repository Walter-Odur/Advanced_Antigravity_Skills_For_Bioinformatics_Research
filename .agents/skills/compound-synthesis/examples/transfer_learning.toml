# REINVENT 4 configuration - Focus a prior on a set of known actives.
# Generator: reinvent (RNN) - Unconstrained de novo design. No input structure needed.
# Generated by agskills. Review before submitting a long run.

run_type = "transfer_learning"
device = "cuda:0"
tb_logdir = "tb_logs"
json_out_config = "_transfer_learning.json"

[parameters]

num_epochs = 50
save_every_n_epochs = 10
batch_size = 50
# num_refs computes similarity against reference molecules.
# Set it to 0 for datasets above ~200 molecules, or the run
# becomes very slow.
num_refs = 0
sample_batch_size = 100

input_model_file = "priors/reinvent.prior"
smiles_file = "actives.smi"
output_model_file = "focused.model"
validation_smiles_file = "holdout.smi"
