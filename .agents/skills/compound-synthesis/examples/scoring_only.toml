# REINVENT 4 configuration - Score an existing set of molecules.
# Generator: reinvent (RNN) - Unconstrained de novo design. No input structure needed.
# Generated by agskills. Review before submitting a long run.

run_type = "scoring"
device = "cpu"
tb_logdir = "tb_logs"
json_out_config = "_scoring.json"

[parameters]

smiles_file = "candidates.smi"
output_csv = "scores.csv"

[scoring]
type = "geometric_mean"

[[scoring.component]]
[scoring.component.QED]
[[scoring.component.QED.endpoint]]
name = "QED drug-likeness"
weight = 1.5

[[scoring.component]]
[scoring.component.MolecularWeight]
[[scoring.component.MolecularWeight.endpoint]]
name = "Molecular weight"
weight = 1
transform.type = "double_sigmoid"
transform.high = 350
transform.low = 200
transform.coef_div = 350
transform.coef_si = 20
transform.coef_se = 20

[[scoring.component]]
[scoring.component.SlogP]
[[scoring.component.SlogP.endpoint]]
name = "Lipophilicity (SlogP)"
weight = 1
transform.type = "double_sigmoid"
transform.high = 3
transform.low = 0
transform.coef_div = 3
transform.coef_si = 20
transform.coef_se = 20

[[scoring.component]]
[scoring.component.NumRotBond]
[[scoring.component.NumRotBond.endpoint]]
name = "Rotatable bonds"
weight = 1
transform.type = "reverse_sigmoid"
transform.high = 7
transform.low = 1
transform.k = 0.5

[[scoring.component]]
[scoring.component.HBondDonors]
[[scoring.component.HBondDonors.endpoint]]
name = "H-bond donors"
weight = 1
transform.type = "reverse_sigmoid"
transform.high = 3
transform.low = 0
transform.k = 0.5

[[scoring.component]]
[scoring.component.HBondAcceptors]
[[scoring.component.HBondAcceptors.endpoint]]
name = "H-bond acceptors"
weight = 1
transform.type = "reverse_sigmoid"
transform.high = 6
transform.low = 0
transform.k = 0.5

[[scoring.component]]
[scoring.component.SAScore]
[[scoring.component.SAScore.endpoint]]
name = "Synthetic accessibility"
weight = 1.5
transform.type = "reverse_sigmoid"
transform.high = 4
transform.low = 1
transform.k = 0.5

[[scoring.component]]
[scoring.component.custom_alerts]
[[scoring.component.custom_alerts.endpoint]]
name = "Unwanted substructures"
weight = 1
params.smarts = [
    "[*;r{8-17}]",
    "[#8][#8]",
    "[#6;+]",
    "[#16][#16]",
    "[#7;!n][S;!$(S(=O)=O)]",
    "[#7;!n][#7;!n]",
    "C#C",
    "C(=[O,S])[O,S]",
    "[#7;!n][C;!$(C(=[O,N])[N,O])][#16;!s]",
    "[#7;!n][C;!$(C(=[O,N])[N,O])][#7;!n]",
    "[#7;!n][C;!$(C(=[O,N])[N,O])][#8;!o]",
    "[#8;!o][C;!$(C(=[O,N])[N,O])][#16;!s]",
    "[#8;!o][C;!$(C(=[O,N])[N,O])][#8;!o]",
    "[#16;!s][C;!$(C(=[O,N])[N,O])][#16;!s]",
]
