# REINVENT4 De Novo RL Example
# Generates novel drug-like molecules from scratch using Reinvent RNN.
# No seed compounds needed. Scoring: QED + MW + LogP + TPSA + PAINS filter.
#
# Usage:
#   reinvent -l denovo.log denovo_rl.toml
#   # or: reinvent -d cpu denovo_rl.toml

run_type = "staged_learning"
device = "cpu"
tb_logdir = "tb_denovo"

[parameters]

summary_csv_prefix = "denovo"
use_checkpoint = false
purge_memories = false
prior_file = "priors/reinvent.prior"
agent_file = "priors/reinvent.prior"
batch_size = 128
unique_sequences = true
randomize_smiles = true

[learning_strategy]

type = "dap"
sigma = 128
rate = 0.0001

[diversity_filter]

type = "IdenticalMurckoScaffold"
bucket_size = 25
minscore = 0.4
minsimilarity = 0.4

# --- Stage 1: Drug-likeness ---
[[stage]]

chkpt_file = "denovo.chkpt"
termination = "simple"
max_score = 0.85
min_steps = 50
max_steps = 300

[stage.scoring]
type = "geometric_mean"

[[stage.scoring.component]]
[stage.scoring.component.Qed]
[[stage.scoring.component.Qed.endpoint]]
name = "QED"
weight = 1.0

[[stage.scoring.component]]
[stage.scoring.component.MolecularWeight]
[[stage.scoring.component.MolecularWeight.endpoint]]
name = "Molecular weight"
weight = 0.5
transform.type = "double_sigmoid"
transform.high = 500.0
transform.low = 200.0
transform.coef_div = 500.0
transform.coef_si = 20.0
transform.coef_se = 20.0

[[stage.scoring.component]]
[stage.scoring.component.SlogP]
[[stage.scoring.component.SlogP.endpoint]]
name = "LogP"
weight = 0.5
transform.type = "reverse_sigmoid"
transform.high = 5.0
transform.low = 1.0
transform.k = 0.5

[[stage.scoring.component]]
[stage.scoring.component.TPSA]
[[stage.scoring.component.TPSA.endpoint]]
name = "TPSA"
weight = 0.3
transform.type = "double_sigmoid"
transform.high = 140.0
transform.low = 20.0
transform.coef_div = 140.0
transform.coef_si = 20.0
transform.coef_se = 20.0

[[stage.scoring.component]]
[stage.scoring.component.custom_alerts]
[[stage.scoring.component.custom_alerts.endpoint]]
name = "PAINS filter"
weight = 0.79
params.smarts = [
    "[*;r{8-17}]",
    "[#8][#8]",
    "[#6;+]",
    "[#16][#16]",
    "[#7;!n][S;!$(S(=O)=O)]",
    "[#7;!n][#7;!n]",
    "C#C",
    "C(=[O,S])[O,S]",
]
