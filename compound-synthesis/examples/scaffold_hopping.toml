# REINVENT4 Scaffold Hopping Example (Mol2Mol)
# Take a known drug and generate molecules with different scaffolds
# but similar activity profile.
#
# Usage:
#   reinvent -l scaffold.log scaffold_hopping.toml

run_type = "staged_learning"
device = "cpu"
tb_logdir = "tb_scaffold"

[parameters]

summary_csv_prefix = "scaffold_hop"
use_checkpoint = false
purge_memories = false
prior_file = "priors/mol2mol_scaffold_generic.prior"
agent_file = "priors/mol2mol_scaffold_generic.prior"
smiles_file = "lead_compound.smi"
sample_strategy = "multinomial"
distance_threshold = 100
batch_size = 64
unique_sequences = true
randomize_smiles = true

[learning_strategy]

type = "dap"
sigma = 128
rate = 0.0001

[diversity_filter]

type = "IdenticalMurckoScaffold"
bucket_size = 25
minscore = 0.4

# --- Stage 1: Optimize drug-likeness while maintaining similarity ---
[[stage]]

chkpt_file = "scaffold_hop.chkpt"
termination = "simple"
max_score = 0.85
min_steps = 30
max_steps = 200

[stage.scoring]
type = "geometric_mean"

[[stage.scoring.component]]
[stage.scoring.component.Qed]
[[stage.scoring.component.Qed.endpoint]]
name = "QED"
weight = 1.0

[[stage.scoring.component]]
[stage.scoring.component.MolecularWeight]
[[stage.scoring.component.MolecularWeight.endpoint]]
name = "Molecular weight"
weight = 0.5
transform.type = "double_sigmoid"
transform.high = 550.0
transform.low = 250.0
transform.coef_div = 500.0
transform.coef_si = 20.0
transform.coef_se = 20.0

[[stage.scoring.component]]
[stage.scoring.component.SlogP]
[[stage.scoring.component.SlogP.endpoint]]
name = "LogP"
weight = 0.5
transform.type = "double_sigmoid"
transform.high = 5.0
transform.low = 1.0
transform.coef_div = 100.0
transform.coef_si = 20.0
transform.coef_se = 20.0

[[stage.scoring.component]]
[stage.scoring.component.SAScore]
[[stage.scoring.component.SAScore.endpoint]]
name = "Synthetic Accessibility"
weight = 0.4
transform.type = "reverse_sigmoid"
transform.high = 5.0
transform.low = 1.0
transform.k = 0.5
